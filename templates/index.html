<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video to MP3</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; color: #e9edf7; background: #0e1423; }
    main { width: min(100%, 560px); padding: 40px; background: #192238; border: 1px solid #303d57; border-radius: 24px; box-shadow: 0 24px 80px #0004; }
    .badge { color: #a6b8ff; font-size: 12px; letter-spacing: .15em; font-weight: 700; }
    h1 { font-size: clamp(28px, 6vw, 38px); margin: 14px 0; letter-spacing: -.04em; }
    p { color: #adb9d0; line-height: 1.6; }
    label { display: block; margin-top: 28px; margin-bottom: 10px; font-weight: 600; }
    input { width: 100%; padding: 18px; border: 1px dashed #6678a0; border-radius: 12px; color: #c9d4eb; }
    input::file-selector-button { border: 0; padding: 10px; margin-right: 12px; border-radius: 6px; cursor: pointer; }
    button, .download { display: block; width: 100%; padding: 15px; margin-top: 20px; border: 0; border-radius: 10px; background: #9dabff; color: #111b3a; font: inherit; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; }
    button:disabled { opacity: .5; cursor: wait; }
    :focus-visible { outline: 3px solid #d5ddff; outline-offset: 4px; }
    small { display: block; color: #8f9db8; margin-top: 12px; }
    #status { margin-bottom: 0; }
    .error { color: #ffb5b5; }
    audio { width: 100%; margin-top: 20px; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { main { padding: 26px; } }
  </style>
</head>
<body>
  <main>
    <span class="badge">VIDEO → AUDIO</span>
    <h1>Your video. Just the audio.</h1>
    <p>Upload a video and turn its audio track into an MP3, ready to preview and download.</p>
    <form id="form">
      <label for="video">Choose a video</label>
      <input id="video" name="video" type="file" accept="video/*,.mkv,.avi,.mov,.webm" required>
      <small>Maximum upload: 500 MB. The video must contain audio.</small>
      <button id="convert" type="submit">Extract MP3</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" aria-label="Extracted audio" hidden>
      <audio id="preview" controls></audio>
      <a id="download" class="download">Download MP3</a>
    </section>
  </main>
  <script>
    const form = document.querySelector('#form');
    const video = document.querySelector('#video');
    const button = document.querySelector('#convert');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    const preview = document.querySelector('#preview');
    const download = document.querySelector('#download');
    let audioUrl;

    function clearResult() {
      preview.pause();
      preview.removeAttribute('src');
      preview.load();
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = null;
      result.hidden = true;
    }

    video.addEventListener('change', () => {
      clearResult();
      status.textContent = '';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearResult();
      status.className = '';
      if (!video.files.length) return;
      if (video.files[0].size > 500 * 1024 * 1024) {
        status.className = 'error';
        status.textContent = 'The upload is too large. The limit is 500 MB.';
        return;
      }
      const data = new FormData(form);
      const filename = video.files[0].name.replace(/\.[^.]+$/, '') || 'audio';
      button.disabled = true;
      video.disabled = true;
      button.textContent = 'Extracting…';
      status.textContent = 'Uploading and extracting audio. Large videos may take a few minutes.';
      try {
        const response = await fetch('/extract', { method: 'POST', body: data });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.error || 'Conversion failed. Please try again.');
        }
        audioUrl = URL.createObjectURL(await response.blob());
        preview.src = audioUrl;
        download.href = audioUrl;
        download.download = filename + '.mp3';
        result.hidden = false;
        status.textContent = 'Your MP3 is ready.';
      } catch (error) {
        status.className = 'error';
        status.textContent = error.message;
      } finally {
        button.disabled = false;
        video.disabled = false;
        button.textContent = 'Extract MP3';
      }
    });
  </script>
</body>
</html>
